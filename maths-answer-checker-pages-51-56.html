<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Maths Answer Checker — Pages 51–56</title>
<style>
  :root {
    color-scheme: light;
    --ink: #17324d;
    --muted: #5e7184;
    --line: #c9d6e2;
    --surface: #ffffff;
    --page: #f4f8fb;
    --accent: #0b74b8;
    --accent-dark: #075c93;
    --good-bg: #e7f7eb;
    --good-line: #2f8f46;
    --good-text: #216b34;
    --bad-bg: #fdecec;
    --bad-line: #c43b3b;
    --bad-text: #9d2626;
    --focus: #ffbf47;
    --shadow: 0 8px 24px rgba(22, 52, 77, .08);
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--page);
    line-height: 1.45;
  }
  .wrap {
    width: min(980px, calc(100% - 28px));
    margin: 0 auto;
    padding: 22px 0 44px;
  }
  .topbar {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.35rem, 2.5vw, 2rem);
    letter-spacing: -0.02em;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    min-height: 48px;
    font: inherit;
    font-weight: 750;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 4px solid var(--focus);
    outline-offset: 2px;
  }
  .reset {
    background: #e9f1f7;
    color: var(--ink);
  }
  .reset:hover { background: #dce9f2; }
  .submit {
    width: 100%;
    margin-top: 22px;
    background: var(--accent);
    color: white;
    font-size: 1.05rem;
  }
  .submit:hover { background: var(--accent-dark); }
  .page-card {
    background: var(--surface);
    border: 1px solid #dbe5ed;
    border-radius: 18px;
    padding: clamp(18px, 3vw, 28px);
    margin: 18px 0;
    box-shadow: var(--shadow);
  }
  .page-card h2 {
    margin: 0 0 18px;
    font-size: 1.3rem;
    color: var(--accent-dark);
  }
  .answer-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .answer-row {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    background: #fff;
    transition: background .15s ease, border-color .15s ease;
  }
  .answer-row > label {
    display: block;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .control-line {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .answer-input {
    width: 9rem;
    max-width: 100%;
    min-height: 46px;
    border: 2px solid #9fb2c3;
    border-radius: 10px;
    padding: 8px 10px;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    background: #fff;
  }
  .unit {
    font-weight: 700;
    color: var(--ink);
  }
  .status {
    min-height: 1.4em;
    font-weight: 800;
    font-size: .95rem;
  }
  .answer-row.correct {
    border-color: var(--good-line);
    background: var(--good-bg);
  }
  .answer-row.correct .answer-input {
    border-color: var(--good-line);
    background: var(--good-bg);
  }
  .answer-row.correct .status { color: var(--good-text); }
  .answer-row.wrong {
    border-color: var(--bad-line);
    background: var(--bad-bg);
  }
  .answer-row.wrong .answer-input {
    border-color: var(--bad-line);
    background: var(--bad-bg);
  }
  .answer-row.wrong .status { color: var(--bad-text); }
  .summary {
    margin-top: 16px;
    min-height: 1.8em;
    text-align: center;
    font-weight: 850;
    font-size: 1.08rem;
  }
  .summary.success { color: var(--good-text); }
  .summary.try { color: var(--ink); }
  @media (max-width: 680px) {
    .answer-grid { grid-template-columns: 1fr; }
    .wrap { width: min(100% - 20px, 980px); padding-top: 14px; }
    .topbar { align-items: stretch; }
    .reset { width: 100%; }
    .answer-input { width: min(11rem, 100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>

function decodeKey(encoded) {
  const text = atob(encoded);
  return JSON.parse(text);
}

function normaliseNumber(raw) {
  const text = String(raw).trim();
  if (!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(text)) return null;

  let sign = "";
  let body = text;
  if (body[0] === "+" || body[0] === "-") {
    sign = body[0];
    body = body.slice(1);
  }

  let [whole, frac = ""] = body.split(".");
  if (whole === "") whole = "0";
  whole = whole.replace(/^0+(?=\d)/, "");
  frac = frac.replace(/0+$/, "");

  if (whole === "") whole = "0";
  const isZero = whole === "0" && frac === "";
  if (isZero) sign = "";
  const core = frac ? whole + "." + frac : whole;
  return sign === "-" ? "-" + core : core;
}

function isCorrectValue(raw, expected) {
  const a = normaliseNumber(raw);
  const b = normaliseNumber(expected);
  return a !== null && b !== null && a === b;
}

function deriveStatus(raw, expected, finalCheck) {
  const trimmed = String(raw).trim();
  if (trimmed === "") return finalCheck ? "wrong" : "idle";
  return isCorrectValue(trimmed, expected) ? "correct" : "wrong";
}

function statusAfterEdit() {
  return "idle";
}

function resetModel(count) {
  return Array.from({ length: count }, () => ({ value: "", status: "idle" }));
}

function allCorrect(values, answers) {
  return values.length === answers.length &&
    values.every((value, i) => deriveStatus(value, answers[i], true) === "correct");
}

function applyStatus(row, input, statusNode, status) {
  row.classList.remove("correct", "wrong");
  input.removeAttribute("aria-invalid");

  if (status === "correct") {
    row.classList.add("correct");
    statusNode.textContent = "Correct!";
  } else if (status === "wrong") {
    row.classList.add("wrong");
    input.setAttribute("aria-invalid", "true");
    statusNode.textContent = "Not quite. Try again.";
  } else {
    statusNode.textContent = "";
  }
}

function init() {
  const key = decodeKey(KEY_B64);
  const keyMap = new Map(key.map(item => [item.id, item.answer]));
  const summary = document.getElementById("summary");
  const inputs = Array.from(document.querySelectorAll(".answer-input"));

  function clearSummary() {
    summary.textContent = "";
    summary.className = "summary";
  }

  function checkInput(input, finalCheck) {
    const row = input.closest(".answer-row");
    const statusNode = document.getElementById(input.id + "-status");
    const expected = keyMap.get(input.id);
    const status = deriveStatus(input.value, expected, finalCheck);
    applyStatus(row, input, statusNode, status);
    return status;
  }

  inputs.forEach(input => {
    input.addEventListener("input", () => {
      const row = input.closest(".answer-row");
      const statusNode = document.getElementById(input.id + "-status");
      applyStatus(row, input, statusNode, statusAfterEdit());
      clearSummary();
    });

    input.addEventListener("blur", () => {
      checkInput(input, false);
    });
  });

  document.getElementById("resetAll").addEventListener("click", () => {
    inputs.forEach(input => {
      input.value = "";
      const row = input.closest(".answer-row");
      const statusNode = document.getElementById(input.id + "-status");
      applyStatus(row, input, statusNode, "idle");
    });
    clearSummary();
    if (inputs[0]) inputs[0].focus();
  });

  document.getElementById("submitAll").addEventListener("click", () => {
    let ok = true;
    let firstProblem = null;

    inputs.forEach(input => {
      const status = checkInput(input, true);
      if (status !== "correct") {
        ok = false;
        if (!firstProblem) firstProblem = input;
      }
    });

    if (ok) {
      summary.textContent = "You got it all correct! Good job!";
      summary.className = "summary success";
    } else {
      summary.textContent = "Keep going — check the red answers and try again.";
      summary.className = "summary try";
      if (firstProblem) firstProblem.focus();
    }
  });
}

if (typeof document !== "undefined") {
  init();
}
