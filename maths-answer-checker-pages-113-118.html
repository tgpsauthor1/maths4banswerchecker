<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Answer Checker - Pages 113-118</title>
<style>
:root{
  --bg:#f6fbff; --card:#fff; --ink:#17324d; --muted:#5d7285; --line:#bdd8ea;
  --accent:#0b73b9; --accent-dark:#075b93; --ok:#2f8f46; --okbg:#e8f7ea;
  --bad:#bf3f3f; --badbg:#fdecec; --focus:#ffbf47; --shape:#0b73b9;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.45;
}
.wrap{width:min(1080px,calc(100% - 24px));margin:auto;padding:22px 0 42px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:clamp(1.45rem,3vw,2.05rem)}
h2{margin:30px 0 12px;color:var(--accent-dark);font-size:1.35rem}
h3{margin:0 0 12px;font-size:1.12rem}
button{
  appearance:none;border:0;border-radius:11px;min-height:44px;padding:10px 16px;
  font:inherit;font-weight:800;cursor:pointer
}
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px
}
.secondary{background:#e8f2f9;color:var(--accent-dark);border:2px solid #b8d6e9}
.primary{background:var(--accent);color:#fff}
.primary:hover{background:var(--accent-dark)}
.panel{
  background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:16px;margin:14px 0;transition:.15s
}
.panel.correct{background:var(--okbg);border-color:var(--ok)}
.panel.incorrect{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.net-card{
  background:#fff;border:1.5px solid #d5e5f0;border-radius:14px;padding:10px;
  display:flex;align-items:center;justify-content:center
}
.net-card svg{display:block;width:100%;height:auto}
.q1-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.q1-item{display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,.8fr);gap:14px;align-items:center}
select,input[type="text"]{
  width:100%;min-height:46px;border:2px solid #b7cddd;border-radius:11px;background:#fff;
  padding:8px 12px;font:inherit;color:var(--ink)
}
.control-wrap.correct select,.control-wrap.correct input[type="text"]{background:var(--okbg);border-color:var(--ok)}
.control-wrap.incorrect select,.control-wrap.incorrect input[type="text"]{background:var(--badbg);border-color:var(--bad)}
.feedback{min-height:1.4em;font-weight:800;margin-top:6px}
.feedback.ok{color:#216d35}.feedback.bad{color:#9b2f2f}
.checkbox-grid{display:grid;grid-template-columns:repeat(7,minmax(58px,1fr));gap:9px;margin:10px 0 14px}
.choice{
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
  border:2px solid #d8e6f1;border-radius:11px;background:#fff;font-weight:800;cursor:pointer
}
.choice input{width:20px;height:20px;accent-color:var(--accent)}
.letter-nets{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.letter-net{text-align:center}
.letter{font-weight:900;margin-top:5px}
.combined{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(0,1.6fr);gap:18px;align-items:start}
.solid-box{max-width:270px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option-card{
  border:2px solid #d5e5f0;border-radius:14px;background:#fff;padding:10px;cursor:pointer
}
.option-card label{display:block;cursor:pointer}
.option-head{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:900;margin-bottom:8px}
.option-head input{width:22px;height:22px;accent-color:var(--accent)}
.name-area{margin-bottom:14px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.submit{width:100%;font-size:1.05rem}
#summary{text-align:center;min-height:1.6em;font-weight:900;font-size:1.05rem;margin-top:10px}
.shape{fill:none;stroke:var(--shape);stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round}
.dash{stroke-dasharray:5 5}
@media(max-width:800px){
  .q1-grid{grid-template-columns:1fr}
  .combined{grid-template-columns:1fr}
  .solid-box{max-width:360px}
  .letter-nets{grid-template-columns:repeat(2,minmax(120px,1fr))}
}
@media(max-width:560px){
  .q1-item{grid-template-columns:1fr}
  .options{grid-template-columns:1fr}
  .checkbox-grid{grid-template-columns:repeat(4,minmax(58px,1fr))}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>

<script>
(() => {
  "use strict";

  const keys = {
    dropdowns: { q1a:"prism", q1b:"cube", q1c:"pyramid", q1d:"cuboid" },
    sets: {
      prism:["D","G"], pyramid:["A","C","E"], cube:["B"], cuboid:["F"]
    },
    combined: {
      q3:{name:"cuboid", net:"A"},
      q4:{name:"prism", net:"A"},
      q5:{name:"pyramid", net:"A"},
      q6:{name:"cube", net:"A"}
    }
  };

  function setFeedback(el, ok){
    el.textContent = ok ? "Correct!" : "Not quite. Try again.";
    el.className = ok ? "feedback ok" : "feedback bad";
  }

  function clearFeedback(el){
    el.textContent = "";
    el.className = "feedback";
  }

  function normalizeText(value){
    return value.trim().replace(/\s+/g," ").toLowerCase();
  }

  function sameSet(actual, expected){
    if(actual.length !== expected.length) return false;
    const a=[...actual].sort(), e=[...expected].sort();
    return a.every((v,i)=>v===e[i]);
  }

  function checkDropdown(wrap, final=false){
    const key=wrap.dataset.dd;
    const select=wrap.querySelector("select");
    const fb=wrap.querySelector(".feedback");
    if(!select.value){
      wrap.classList.remove("correct");
      if(final){ wrap.classList.add("incorrect"); setFeedback(fb,false); }
      else { wrap.classList.remove("incorrect"); clearFeedback(fb); }
      return false;
    }
    const ok=select.value===keys.dropdowns[key];
    wrap.classList.toggle("correct",ok);
    wrap.classList.toggle("incorrect",!ok);
    setFeedback(fb,ok);
    return ok;
  }

  document.querySelectorAll("[data-dd]").forEach(wrap=>{
    const select=wrap.querySelector("select");
    select.addEventListener("change",()=>checkDropdown(wrap,false));
  });

  function buildSetChoices(panel){
    const grid=panel.querySelector(".checkbox-grid");
    "ABCDEFG".split("").forEach(letter=>{
      const label=document.createElement("label");
      label.className="choice";
      const input=document.createElement("input");
      input.type="checkbox"; input.value=letter;
      label.append(input,document.createTextNode(" "+letter));
      grid.appendChild(label);
      input.addEventListener("change",()=>{
        panel.classList.remove("correct","incorrect");
        clearFeedback(panel.querySelector(".feedback"));
        document.getElementById("summary").textContent="";
      });
    });
  }

  function checkSet(panel){
    const expected=keys.sets[panel.dataset.set];
    const actual=[...panel.querySelectorAll('input[type="checkbox"]:checked')].map(i=>i.value);
    const ok=sameSet(actual,expected);
    panel.classList.toggle("correct",ok);
    panel.classList.toggle("incorrect",!ok);
    setFeedback(panel.querySelector(".feedback"),ok);
    return ok;
  }

  document.querySelectorAll(".set-panel").forEach(panel=>{
    buildSetChoices(panel);
    panel.querySelector(".set-check").addEventListener("click",()=>{
      document.getElementById("summary").textContent="";
      checkSet(panel);
    });
  });

  function combinedParts(panel){
    const input=panel.querySelector('input[type="text"]');
    const radio=panel.querySelector('input[type="radio"]:checked');
    return {input, radio, hasName:normalizeText(input.value)!=="", hasRadio:!!radio};
  }

  function clearCombined(panel){
    panel.classList.remove("correct","incorrect");
    panel.querySelector(".control-wrap").classList.remove("correct","incorrect");
    clearFeedback(panel.querySelector(".feedback"));
    document.getElementById("summary").textContent="";
  }

  function checkCombined(panel, final=false){
    const key=panel.dataset.combined;
    const expected=keys.combined[key];
    const parts=combinedParts(panel);
    const nameWrap=panel.querySelector(".control-wrap");
    const fb=panel.querySelector(".feedback");

    if(!(parts.hasName && parts.hasRadio)){
      panel.classList.remove("correct");
      nameWrap.classList.remove("correct");
      if(final){
        panel.classList.add("incorrect");
        nameWrap.classList.toggle("incorrect",!parts.hasName);
        setFeedback(fb,false);
      } else {
        panel.classList.remove("incorrect");
        nameWrap.classList.remove("incorrect");
        clearFeedback(fb);
      }
      return false;
    }

    const okName=normalizeText(parts.input.value)===expected.name;
    const okNet=parts.radio.value===expected.net;
    const ok=okName && okNet;

    panel.classList.toggle("correct",ok);
    panel.classList.toggle("incorrect",!ok);
    nameWrap.classList.toggle("correct",ok);
    nameWrap.classList.toggle("incorrect",!ok);
    setFeedback(fb,ok);
    return ok;
  }

  document.querySelectorAll(".combined-panel").forEach(panel=>{
    const input=panel.querySelector('input[type="text"]');
    input.addEventListener("input",()=>clearCombined(panel));
    input.addEventListener("blur",()=>checkCombined(panel,false));
    panel.querySelectorAll('input[type="radio"]').forEach(r=>{
      r.addEventListener("change",()=>checkCombined(panel,false));
    });
  });

  document.getElementById("submitAll").addEventListener("click",()=>{
    const results=[];
    document.querySelectorAll("[data-dd]").forEach(w=>results.push(checkDropdown(w,true)));
    document.querySelectorAll(".set-panel").forEach(p=>results.push(checkSet(p)));
    document.querySelectorAll(".combined-panel").forEach(p=>results.push(checkCombined(p,true)));
    document.getElementById("summary").textContent = results.every(Boolean)
      ? "You got it all correct! Good job!"
      : "Keep going — check your answers and try again.";
  });

  document.getElementById("resetAll").addEventListener("click",()=>{
    document.querySelectorAll("select").forEach(s=>s.value="");
    document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(i=>i.checked=false);
    document.querySelectorAll('input[type="text"]').forEach(i=>i.value="");
    document.querySelectorAll(".panel,.control-wrap").forEach(el=>el.classList.remove("correct","incorrect"));
    document.querySelectorAll(".feedback").forEach(clearFeedback);
    document.getElementById("summary").textContent="";
    const first=document.querySelector("select");
    if(first) first.focus();
  });
})();
</script>
</body>
</html>
