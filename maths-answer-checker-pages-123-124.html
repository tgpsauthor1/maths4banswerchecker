<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Answer Checker — Pages 123–124</title>
<style>
  :root{
    color-scheme:light;
    --ink:#1f2933;
    --muted:#52606d;
    --blue:#0b73b8;
    --blue-dark:#075487;
    --grid:#b8c2cc;
    --panel:#ffffff;
    --bg:#f6f9fc;
    --user:#243b53;
    --correct-bg:#e7f7eb;
    --correct-border:#2b8a3e;
    --wrong-bg:#fdebec;
    --wrong-border:#c92a2a;
    --focus:#7c3aed;
    --selected:#dbeafe;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.45;
  }

  .app{
    width:min(1050px,calc(100% - 20px));
    margin:0 auto;
    padding:22px 0 44px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }

  h1{
    margin:0;
    color:var(--blue-dark);
    font-size:clamp(1.45rem,3vw,2rem);
  }

  h2{
    margin:0 0 16px;
    font-size:1.3rem;
  }

  button{
    appearance:none;
    border:2px solid var(--blue);
    background:var(--blue);
    color:#fff;
    border-radius:12px;
    padding:10px 16px;
    min-height:44px;
    font:inherit;
    font-weight:750;
    cursor:pointer;
    touch-action:manipulation;
  }

  button:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
  button:focus-visible,
  .draw-svg:focus-visible,
  .shade-cell:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:3px;
  }

  .secondary{
    background:#fff;
    color:var(--blue-dark);
  }
  .secondary:hover{background:#eef7fd;color:var(--blue-dark)}

  .page{
    background:var(--panel);
    border:2px solid #d6dee6;
    border-radius:18px;
    padding:clamp(16px,3vw,26px);
    margin-bottom:24px;
  }

  .parts{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
  }

  .part{
    border:2px solid #d6dee6;
    border-radius:16px;
    padding:16px;
    min-width:0;
    background:#fff;
    transition:background .15s,border-color .15s;
  }

  .part.correct{
    background:var(--correct-bg);
    border-color:var(--correct-border);
  }

  .part.incorrect{
    background:var(--wrong-bg);
    border-color:var(--wrong-border);
  }

  .part-title{
    margin:0 0 9px;
    font-size:1.1rem;
  }

  .helper{
    color:var(--muted);
    font-size:.93rem;
    margin:0 0 12px;
  }

  .draw-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 12px;
  }

  .draw-svg{
    width:min(100%,360px);
    aspect-ratio:1;
    background:#fff;
    border-radius:10px;
    touch-action:none;
  }

  .part-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }

  .part-actions button{
    padding:8px 13px;
    min-height:40px;
  }

  .result{
    min-height:1.4em;
    font-weight:800;
    margin-top:10px;
  }
  .result.ok{color:#1e6f32}
  .result.no{color:#a61e1e}

  .shade-wrap{
    display:flex;
    justify-content:center;
    margin:8px 0 14px;
  }

  .shade-grid{
    --cell:min(5.3vw,40px);
    position:relative;
    display:grid;
    grid-template-columns:repeat(8,var(--cell));
    grid-template-rows:repeat(8,var(--cell));
    width:calc(var(--cell) * 8);
    height:calc(var(--cell) * 8);
    border-left:1px solid var(--grid);
    border-top:1px solid var(--grid);
    background:#fff;
  }

  .shade-cell{
    width:var(--cell);
    height:var(--cell);
    min-height:0;
    padding:0;
    border-radius:0;
    border:0;
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    background:#fff;
    position:relative;
    z-index:1;
  }

  .shade-cell:hover{background:#eef5fa;border-color:var(--grid)}

  .shade-cell.given{
    background:#92afd4;
    cursor:default;
  }

  .shade-cell.given:hover{background:#92afd4}

  .shade-cell.student{
    background:var(--selected);
  }

  .shade-cell.student:hover{background:var(--selected)}

  .axis-overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
    pointer-events:none;
    overflow:visible;
  }

  .submit-box{
    background:#fff;
    border:2px solid #d6dee6;
    border-radius:18px;
    padding:20px;
  }

  #submitAll{
    width:100%;
    font-size:1.05rem;
  }

  #overall{
    min-height:1.5em;
    margin:14px 0 0;
    text-align:center;
    font-weight:850;
  }

  @media(max-width:760px){
    .parts{grid-template-columns:1fr}
    .shade-grid{--cell:min(10.5vw,44px)}
  }

  @media(max-width:420px){
    .app{width:min(100% - 12px,1050px);padding-top:12px}
    header{align-items:stretch}
    header button{width:100%}
    .part{padding:12px}
    .shade-grid{--cell:min(10.3vw,42px)}
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Checking answers for pages 123–124</h1>
    <button type="button" id="resetAll" class="secondary">Reset all</button>
  </header>

  <section class="page" aria-labelledby="page123-title">
    <h2 id="page123-title">Checking answers for page 123</h2>
    <div class="parts" id="drawParts"></div>
  </section>

  <section class="page" aria-labelledby="page124-title">
    <h2 id="page124-title">Checking answers for page 124</h2>
    <div class="parts" id="shadeParts"></div>
  </section>

  <section class="submit-box" aria-label="Submit all answers">
    <button type="button" id="submitAll">Submit all</button>
    <p id="overall" aria-live="polite"></p>
  </section>
</main>

<script>
(() => {
  "use strict";

  const N = 8;
  const drawItems = [
    {
      id:"123-a", label:"1(a)", axis:{kind:"v", value:4},
      given:[
        [[4,2],[1,2]], [[1,2],[1,3]], [[1,3],[3,3]],
        [[3,3],[3,5]], [[3,5],[2,5]], [[2,5],[2,7]],
        [[2,7],[4,7]]
      ]
    },
    {
      id:"123-b", label:"1(b)", axis:{kind:"h", value:4},
      given:[
        [[1,4],[1,1]], [[1,1],[2,1]], [[2,1],[2,2]],
        [[2,2],[4,2]], [[4,2],[4,3]], [[4,3],[6,3]],
        [[6,3],[6,1]], [[6,1],[7,1]], [[7,1],[7,4]]
      ]
    },
    {
      id:"123-c", label:"1(c)", axis:{kind:"v", value:4},
      given:[
        [[4,2],[2,2]], [[2,2],[1,6]], [[1,6],[4,6]]
      ]
    },
    {
      id:"123-d", label:"1(d)", axis:{kind:"h", value:4},
      given:[
        [[1,4],[1,2]], [[1,2],[3,3]], [[3,3],[7,1]],
        [[7,1],[6,4]]
      ]
    },
    {
      id:"123-e", label:"1(e)", axis:{kind:"anti", value:8},
      given:[
        [[3,5],[3,1]], [[3,1],[7,1]],
        [[3,5],[1,5]], [[1,5],[1,7]]
      ]
    },
    {
      id:"123-f", label:"1(f)", axis:{kind:"main"},
      given:[
        [[1,1],[1,4]], [[1,4],[2,4]], [[2,4],[2,6]],
        [[2,6],[3,5]], [[3,5],[4,6]], [[4,6],[5,5]]
      ]
    }
  ];

  const shadeItems = [
    {
      id:"124-a", label:"2(a)", axis:{kind:"v", value:4},
      given:[[2,4],[3,3],[3,4],[4,3],[4,4],[5,3],[5,4],[6,3],[6,4],[7,4]]
    },
    {
      id:"124-b", label:"2(b)", axis:{kind:"h", value:4},
      given:[[2,4],[3,3],[3,4],[3,5],[4,2],[4,3],[4,4],[4,5],[4,6],[4,7]]
    },
    {
      id:"124-c", label:"2(c)", axis:{kind:"v", value:4},
      given:[[1,2],[2,3],[2,4],[3,3],[3,4],[4,2],[5,2],[6,3],[6,4],[7,3],[7,4],[8,2]]
    },
    {
      id:"124-d", label:"2(d)", axis:{kind:"h", value:4},
      given:[[2,4],[2,5],[3,3],[3,4],[3,5],[3,6],[4,2],[4,7]]
    },
    {
      id:"124-e", label:"2(e)", axis:{kind:"main"},
      given:[
        [2,2],[7,7],
        [2,3],[2,4],[2,5],[2,6],[2,7],
        [3,5],[3,6],[3,7],
        [4,5],[4,6],[4,7],
        [5,7],[6,7]
      ]
    },
    {
      id:"124-f", label:"2(f)", axis:{kind:"anti", value:9},
      given:[
        [2,2],[3,3],[4,4],
        [2,7],[3,6],[4,5],[5,4],[6,3],[7,2]
      ]
    }
  ];

  const drawState = new Map();
  const shadeState = new Map();

  function reflectPoint(point, axis){
    const [x,y] = point;
    if(axis.kind === "v") return [2 * axis.value - x, y];
    if(axis.kind === "h") return [x, 2 * axis.value - y];
    if(axis.kind === "main") return [y, x];
    if(axis.kind === "anti") return [axis.value - y, axis.value - x];
    throw new Error("Unknown axis");
  }

  function reflectCell(cell, axis){
    const [r,c] = cell;
    if(axis.kind === "v") return [r, (2 * axis.value + 1) - c];
    if(axis.kind === "h") return [(2 * axis.value + 1) - r, c];
    if(axis.kind === "main") return [c, r];
    if(axis.kind === "anti") return [axis.value - c, axis.value - r];
    throw new Error("Unknown axis");
  }

  function gcd(a,b){
    a=Math.abs(a); b=Math.abs(b);
    while(b){ const t=b; b=a%b; a=t; }
    return a;
  }

  function pointKey(p){ return `${p[0]},${p[1]}`; }

  function edgeKey(a,b){
    const ka=pointKey(a), kb=pointKey(b);
    return ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
  }

  function segmentEdges(seg){
    const [[x1,y1],[x2,y2]] = seg;
    const dx=x2-x1, dy=y2-y1;
    const steps=gcd(dx,dy);
    if(steps===0) return [];
    const sx=dx/steps, sy=dy/steps;
    const out=[];
    for(let i=0;i<steps;i++){
      const a=[x1+i*sx,y1+i*sy];
      const b=[x1+(i+1)*sx,y1+(i+1)*sy];
      out.push(edgeKey(a,b));
    }
    return out;
  }

  function edgeSet(segments){
    const set=new Set();
    segments.forEach(seg => segmentEdges(seg).forEach(k => set.add(k)));
    return set;
  }

  function setsEqual(a,b){
    if(a.size!==b.size) return false;
    for(const v of a) if(!b.has(v)) return false;
    return true;
  }

  function cellKey(cell){ return `${cell[0]},${cell[1]}`; }

  function setPartState(part, correct){
    part.classList.toggle("correct", correct);
    part.classList.toggle("incorrect", !correct);
    const result=part.querySelector(".result");
    result.textContent=correct ? "Correct!" : "Not quite. Try again.";
    result.className=`result ${correct ? "ok" : "no"}`;
  }

  function clearPartState(part){
    part.classList.remove("correct","incorrect");
    const result=part.querySelector(".result");
    result.textContent="";
    result.className="result";
    document.getElementById("overall").textContent="";
  }

  function axisLine(axis, scale, pad){
    const p=v => pad + v*scale;
    if(axis.kind==="v") return [p(axis.value),p(0),p(axis.value),p(N)];
    if(axis.kind==="h") return [p(0),p(axis.value),p(N),p(axis.value)];
    if(axis.kind==="main") return [p(0),p(0),p(N),p(N)];
    return [p(0),p(axis.value),p(axis.value),p(0)];
  }

  function renderDrawItem(item){
    const host=document.getElementById("drawParts");
    const part=document.createElement("article");
    part.className="part";
    part.dataset.item=item.id;
    part.innerHTML=`
      <h3 class="part-title">${item.label}</h3>
      <p class="helper">Tap two grid intersections to add a segment. Keyboard: arrow keys + Enter.</p>
      <div class="draw-wrap"></div>
      <div class="part-actions">
        <button type="button" class="secondary undo">Undo</button>
        <button type="button" class="secondary clear">Clear</button>
        <button type="button" class="check">Check</button>
      </div>
      <div class="result" aria-live="polite"></div>
    `;
    host.appendChild(part);

    const pad=16, scale=32, size=pad*2+scale*N;
    const NS="http://www.w3.org/2000/svg";
    const svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox",`0 0 ${size} ${size}`);
    svg.setAttribute("class","draw-svg");
    svg.setAttribute("tabindex","0");
    svg.setAttribute("role","application");
    svg.setAttribute("aria-label",`${item.label} drawing grid`);
    part.querySelector(".draw-wrap").appendChild(svg);

    const grid=document.createElementNS(NS,"g");
    for(let i=0;i<=N;i++){
      const pos=pad+i*scale;
      for(const [x1,y1,x2,y2] of [[pad,pos,pad+N*scale,pos],[pos,pad,pos,pad+N*scale]]){
        const line=document.createElementNS(NS,"line");
        line.setAttribute("x1",x1); line.setAttribute("y1",y1);
        line.setAttribute("x2",x2); line.setAttribute("y2",y2);
        line.setAttribute("stroke","#b8c2cc"); line.setAttribute("stroke-width","1");
        grid.appendChild(line);
      }
    }
    svg.appendChild(grid);

    const ax=axisLine(item.axis,scale,pad);
    const axis=document.createElementNS(NS,"line");
    ["x1","y1","x2","y2"].forEach((name,i)=>axis.setAttribute(name,ax[i]));
    axis.setAttribute("stroke","#1f2933");
    axis.setAttribute("stroke-width","2");
    axis.setAttribute("stroke-dasharray","6 6");
    svg.appendChild(axis);

    const givenGroup=document.createElementNS(NS,"g");
    givenGroup.setAttribute("aria-hidden","true");
    item.given.forEach(seg=>{
      const line=document.createElementNS(NS,"line");
      line.setAttribute("x1",pad+seg[0][0]*scale);
      line.setAttribute("y1",pad+seg[0][1]*scale);
      line.setAttribute("x2",pad+seg[1][0]*scale);
      line.setAttribute("y2",pad+seg[1][1]*scale);
      line.setAttribute("stroke","#0b73b8");
      line.setAttribute("stroke-width","4");
      line.setAttribute("stroke-linecap","round");
      givenGroup.appendChild(line);
    });
    svg.appendChild(givenGroup);

    const userGroup=document.createElementNS(NS,"g");
    svg.appendChild(userGroup);

    const marker=document.createElementNS(NS,"circle");
    marker.setAttribute("r","5");
    marker.setAttribute("fill","#7c3aed");
    marker.setAttribute("visibility","hidden");
    svg.appendChild(marker);

    const cursor=document.createElementNS(NS,"circle");
    cursor.setAttribute("r","6");
    cursor.setAttribute("fill","none");
    cursor.setAttribute("stroke","#7c3aed");
    cursor.setAttribute("stroke-width","2");
    cursor.setAttribute("visibility","hidden");
    svg.appendChild(cursor);

    const state={segments:[], first:null, cursor:[0,0], item, part, svg, userGroup, marker, cursor, pad, scale};
    drawState.set(item.id,state);

    function redraw(){
      userGroup.replaceChildren();
      state.segments.forEach(seg=>{
        const line=document.createElementNS(NS,"line");
        line.setAttribute("x1",pad+seg[0][0]*scale);
        line.setAttribute("y1",pad+seg[0][1]*scale);
        line.setAttribute("x2",pad+seg[1][0]*scale);
        line.setAttribute("y2",pad+seg[1][1]*scale);
        line.setAttribute("stroke","#243b53");
        line.setAttribute("stroke-width","4");
        line.setAttribute("stroke-linecap","round");
        userGroup.appendChild(line);
      });
      if(state.first){
        marker.setAttribute("cx",pad+state.first[0]*scale);
        marker.setAttribute("cy",pad+state.first[1]*scale);
        marker.setAttribute("visibility","visible");
      }else{
        marker.setAttribute("visibility","hidden");
      }
    }

    function choosePoint(point){
      if(!state.first){
        state.first=point;
      }else{
        if(state.first[0]!==point[0] || state.first[1]!==point[1]){
          state.segments.push([state.first,point]);
        }
        state.first=null;
      }
      clearPartState(part);
      redraw();
    }

    svg.addEventListener("pointerdown",ev=>{
      ev.preventDefault();
      const rect=svg.getBoundingClientRect();
      const vx=(ev.clientX-rect.left)/rect.width*size;
      const vy=(ev.clientY-rect.top)/rect.height*size;
      const gx=Math.max(0,Math.min(N,Math.round((vx-pad)/scale)));
      const gy=Math.max(0,Math.min(N,Math.round((vy-pad)/scale)));
      state.cursor=[gx,gy];
      choosePoint([gx,gy]);
      svg.focus();
    });

    svg.addEventListener("focus",()=>{
      cursor.setAttribute("visibility","visible");
      cursor.setAttribute("cx",pad+state.cursor[0]*scale);
      cursor.setAttribute("cy",pad+state.cursor[1]*scale);
    });
    svg.addEventListener("blur",()=>cursor.setAttribute("visibility","hidden"));
    svg.addEventListener("keydown",ev=>{
      let [x,y]=state.cursor;
      if(ev.key==="ArrowLeft"){x=Math.max(0,x-1);}
      else if(ev.key==="ArrowRight"){x=Math.min(N,x+1);}
      else if(ev.key==="ArrowUp"){y=Math.max(0,y-1);}
      else if(ev.key==="ArrowDown"){y=Math.min(N,y+1);}
      else if(ev.key==="Enter" || ev.key===" "){
        ev.preventDefault();
        choosePoint([x,y]);
        return;
      }else{return;}
      ev.preventDefault();
      state.cursor=[x,y];
      cursor.setAttribute("cx",pad+x*scale);
      cursor.setAttribute("cy",pad+y*scale);
    });

    part.querySelector(".undo").addEventListener("click",()=>{
      if(state.first){ state.first=null; }
      else{ state.segments.pop(); }
      clearPartState(part); redraw();
    });

    part.querySelector(".clear").addEventListener("click",()=>{
      state.first=null; state.segments=[];
      clearPartState(part); redraw();
    });

    part.querySelector(".check").addEventListener("click",()=>checkDraw(item.id));
  }

  function checkDraw(id){
    const state=drawState.get(id);
    const expectedSegments=state.item.given.map(seg=>[
      reflectPoint(seg[0],state.item.axis),
      reflectPoint(seg[1],state.item.axis)
    ]);
    const correct=setsEqual(edgeSet(state.segments),edgeSet(expectedSegments));
    setPartState(state.part,correct);
    return correct;
  }

  function renderShadeItem(item){
    const host=document.getElementById("shadeParts");
    const part=document.createElement("article");
    part.className="part";
    part.dataset.item=item.id;
    part.innerHTML=`
      <h3 class="part-title">${item.label}</h3>
      <p class="helper">Tap squares to shade or unshade them.</p>
      <div class="shade-wrap"></div>
      <div class="part-actions">
        <button type="button" class="secondary clear">Clear</button>
        <button type="button" class="check">Check</button>
      </div>
      <div class="result" aria-live="polite"></div>
    `;
    host.appendChild(part);

    const grid=document.createElement("div");
    grid.className="shade-grid";
    grid.setAttribute("role","group");
    grid.setAttribute("aria-label",`${item.label} shading grid`);
    part.querySelector(".shade-wrap").appendChild(grid);

    const givenSet=new Set(item.given.map(cellKey));
    const selected=new Set();

    for(let r=1;r<=N;r++){
      for(let c=1;c<=N;c++){
        const key=`${r},${c}`;
        const cell=document.createElement("button");
        cell.type="button";
        cell.className="shade-cell";
        cell.setAttribute("aria-label",`Row ${r}, column ${c}`);
        if(givenSet.has(key)){
          cell.classList.add("given");
          cell.disabled=true;
          cell.setAttribute("aria-label",`Row ${r}, column ${c}, given`);
        }else{
          cell.setAttribute("aria-pressed","false");
          cell.addEventListener("click",()=>{
            if(selected.has(key)){
              selected.delete(key);
              cell.classList.remove("student");
              cell.setAttribute("aria-pressed","false");
            }else{
              selected.add(key);
              cell.classList.add("student");
              cell.setAttribute("aria-pressed","true");
            }
            clearPartState(part);
          });
        }
        grid.appendChild(cell);
      }
    }

    const NS="http://www.w3.org/2000/svg";
    const overlay=document.createElementNS(NS,"svg");
    overlay.setAttribute("class","axis-overlay");
    overlay.setAttribute("viewBox","0 0 8 8");
    overlay.setAttribute("preserveAspectRatio","none");
    const line=document.createElementNS(NS,"line");
    let coords;
    if(item.axis.kind==="v") coords=[item.axis.value,0,item.axis.value,8];
    else if(item.axis.kind==="h") coords=[0,item.axis.value,8,item.axis.value];
    else if(item.axis.kind==="main") coords=[0,0,8,8];
    else coords=[0,8,8,0];
    ["x1","y1","x2","y2"].forEach((n,i)=>line.setAttribute(n,coords[i]));
    line.setAttribute("stroke","#1f2933");
    line.setAttribute("stroke-width",".06");
    line.setAttribute("stroke-dasharray",".18 .14");
    line.setAttribute("vector-effect","non-scaling-stroke");
    overlay.appendChild(line);
    grid.appendChild(overlay);

    const state={item,part,grid,givenSet,selected};
    shadeState.set(item.id,state);

    part.querySelector(".clear").addEventListener("click",()=>{
      selected.clear();
      grid.querySelectorAll(".shade-cell.student").forEach(cell=>{
        cell.classList.remove("student");
        cell.setAttribute("aria-pressed","false");
      });
      clearPartState(part);
    });

    part.querySelector(".check").addEventListener("click",()=>checkShade(item.id));
  }

  function checkShade(id){
    const state=shadeState.get(id);
    const expected=new Set();
    state.item.given.forEach(cell=>{
      const reflected=reflectCell(cell,state.item.axis);
      const key=cellKey(reflected);
      if(!state.givenSet.has(key)) expected.add(key);
    });
    const correct=setsEqual(state.selected,expected);
    setPartState(state.part,correct);
    return correct;
  }

  drawItems.forEach(renderDrawItem);
  shadeItems.forEach(renderShadeItem);

  document.getElementById("resetAll").addEventListener("click",()=>{
    drawState.forEach(state=>{
      state.segments=[];
      state.first=null;
      state.userGroup.replaceChildren();
      state.marker.setAttribute("visibility","hidden");
      clearPartState(state.part);
    });
    shadeState.forEach(state=>{
      state.selected.clear();
      state.grid.querySelectorAll(".shade-cell.student").forEach(cell=>{
        cell.classList.remove("student");
        cell.setAttribute("aria-pressed","false");
      });
      clearPartState(state.part);
    });
    document.getElementById("overall").textContent="";
  });

  document.getElementById("submitAll").addEventListener("click",()=>{
    const results=[
      ...drawItems.map(item=>checkDraw(item.id)),
      ...shadeItems.map(item=>checkShade(item.id))
    ];
    document.getElementById("overall").textContent=
      results.every(Boolean)
        ? "You got it all correct! Good job!"
        : "Keep going — check each part and try again.";
  });
})();
</script>
</body>
</html>
