<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Answer Checker — Pages 17–20</title>
<style>
  :root {
    --blue: #0b73b9;
    --blue-dark: #075b93;
    --ink: #17202a;
    --muted: #5f6b76;
    --border: #b9c6d2;
    --correct-bg: #e8f7ec;
    --correct-border: #2e8b57;
    --wrong-bg: #fdecec;
    --wrong-border: #c53a3a;
    --focus: #7ab8e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f8fb;
    color: var(--ink);
    line-height: 1.45;
  }
  .app {
    width: min(900px, calc(100% - 24px));
    margin: 18px auto 40px;
  }
  header {
    background: white;
    border: 1px solid #dbe4ec;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.35rem, 4vw, 2rem);
    color: var(--blue-dark);
  }
  button {
    min-height: 44px;
    padding: 10px 16px;
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  #resetAll {
    background: #eef3f7;
    color: var(--ink);
  }
  #submitAll {
    display: block;
    margin: 22px auto 0;
    background: var(--blue);
    color: white;
    min-width: 170px;
  }
  #submitAll:hover { background: var(--blue-dark); }
  .page {
    margin-top: 20px;
    background: white;
    border: 1px solid #dbe4ec;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.04);
  }
  .page h2 {
    margin: 0 0 14px;
    font-size: 1.15rem;
    color: var(--blue-dark);
  }
  .question {
    border: 1px solid #d9e2ea;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
  }
  .question:first-of-type { margin-top: 0; }
  .q-title {
    margin: 0 0 10px;
    font-weight: 800;
  }
  .answer-row,
  .part-row {
    display: flex;
    align-items: end;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }
  .field {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
  }
  .field-label {
    font-size: .88rem;
    font-weight: 700;
    color: var(--muted);
  }
  input, select {
    min-height: 46px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: white;
    color: var(--ink);
    font: inherit;
    padding: 8px 10px;
    transition: background .12s ease, border-color .12s ease;
  }
  input {
    width: 132px;
    text-align: center;
  }
  select { min-width: 132px; }
  input.correct, select.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
  }
  input.wrong, select.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
  }
  .relation {
    min-height: 46px;
    display: inline-flex;
    align-items: center;
    font-size: 1.4rem;
    font-weight: 800;
  }
  .status {
    min-height: 1.4em;
    margin-top: 8px;
    font-weight: 800;
  }
  .status.correct-text { color: #206d42; }
  .status.wrong-text { color: #a72d2d; }
  .summary {
    min-height: 1.5em;
    margin: 18px 0 0;
    text-align: center;
    font-weight: 800;
  }
  .summary.success { color: #206d42; }
  .summary.try { color: #7b4d00; }
  @media (max-width: 560px) {
    .app { width: min(100% - 14px, 900px); margin-top: 7px; }
    header, .page { border-radius: 14px; padding: 14px; }
    .question { padding: 12px; }
    input { width: 112px; }
    select { min-width: 112px; max-width: 100%; }
  }
</style>
</head>
<body>

        <label class="field"><span class="field-label">5(h)</span><select data-part="h" aria-label="Question 5 part h"><option value=""></option><option value="&lt;">&lt;</option><option value="&gt;">&gt;</option></select></label>

        <label class="field"><span class="field-label">7(b)</span><select data-part="b" aria-label="Question 7 part b"><option value=""></option><option>4.08</option><option>4.083</option><option>4.13</option></select></label>

</main>

<script>
(() => {
  "use strict";

  const combinedAnswers = {
    q1: ["2.5", "2.9"],
    q2: ["6.59", "6.53"],
    q3: ["4.922", "4.928"],
    q4: ["62.8", "62.48"],
    q8a: ["12.347", "12.437", "12.743"],
    q8b: ["5.028", "5.08", "5.208"],
    q9a: ["9.94", "9.49", "8.24"],
    q9b: ["3.825", "2.83", "2.385"],
    q9c: ["7", "0.7", "0.07"]
  };

  const choiceAnswers = {
    q5: { a: ">", b: "<", c: ">", d: "<", e: "<", f: ">", g: "<", h: "<" },
    q6: { a: "6.31", b: "9.25", c: "3.06" },
    q7: { a: "3.52", b: "4.13", c: "1.8" }
  };

  const decimalPattern = /^-?(?:0(?:\.\d+)?|[1-9]\d*(?:\.\d+)?)$/;

  function canonicalDecimal(raw) {
    const s = String(raw).trim();
    if (!decimalPattern.test(s)) return null;

    const negative = s.startsWith("-");
    const unsigned = negative ? s.slice(1) : s;
    let [whole, fraction = ""] = unsigned.split(".");

    fraction = fraction.replace(/0+$/, "");
    let digits = (whole + fraction).replace(/^0+/, "");
    if (digits === "") digits = "0";

    const sign = negative && digits !== "0" ? "-" : "+";
    return `${sign}:${digits}:${fraction.length}`;
  }

  function decimalEqual(a, b) {
    const ca = canonicalDecimal(a);
    const cb = canonicalDecimal(b);
    return ca !== null && ca === cb;
  }

  function setControlState(control, state) {
    control.classList.remove("correct", "wrong");
    control.removeAttribute("aria-invalid");
    if (state === "correct") {
      control.classList.add("correct");
    } else if (state === "wrong") {
      control.classList.add("wrong");
      control.setAttribute("aria-invalid", "true");
    }
  }

  function setStatus(panel, state) {
    const status = panel.querySelector(".status");
    status.classList.remove("correct-text", "wrong-text");
    if (state === "correct") {
      status.textContent = "Correct!";
      status.classList.add("correct-text");
    } else if (state === "wrong") {
      status.textContent = "Not quite. Try again.";
      status.classList.add("wrong-text");
    } else {
      status.textContent = "";
    }
  }

  function clearPanel(panel) {
    panel.querySelectorAll("input, select").forEach(control => setControlState(control, "clear"));
    setStatus(panel, "clear");
    document.getElementById("summary").textContent = "";
    document.getElementById("summary").className = "summary";
  }

  function checkCombined(panel, finalSubmit = false) {
    const id = panel.dataset.id;
    const expected = combinedAnswers[id];
    const controls = Array.from(panel.querySelectorAll("input"));
    const values = controls.map(c => c.value.trim());
    const complete = values.every(v => v !== "");

    if (!complete && !finalSubmit) return null;

    if (!complete) {
      controls.forEach(c => setControlState(c, "wrong"));
      setStatus(panel, "wrong");
      return false;
    }

    const correct = values.every((value, i) => decimalEqual(value, expected[i]));
    controls.forEach(c => setControlState(c, correct ? "correct" : "wrong"));
    setStatus(panel, correct ? "correct" : "wrong");
    return correct;
  }

  function checkChoice(control, finalSubmit = false) {
    const panel = control.closest(".question");
    const id = panel.dataset.id;
    const part = control.dataset.part;
    const value = control.value;

    if (value === "" && !finalSubmit) return null;

    const correct = value !== "" && value === choiceAnswers[id][part];
    setControlState(control, correct ? "correct" : "wrong");
    return correct;
  }

  function refreshChoicePanelStatus(panel) {
    const controls = Array.from(panel.querySelectorAll("select"));
    const anyWrong = controls.some(c => c.classList.contains("wrong"));
    const allCorrect = controls.length > 0 && controls.every(c => c.classList.contains("correct"));

    if (allCorrect) setStatus(panel, "correct");
    else if (anyWrong) setStatus(panel, "wrong");
    else setStatus(panel, "clear");
  }

  document.querySelectorAll(".combined input").forEach(input => {
    input.addEventListener("input", () => clearPanel(input.closest(".combined")));
    input.addEventListener("blur", () => checkCombined(input.closest(".combined"), false));
  });

  document.querySelectorAll(".question select").forEach(select => {
    select.addEventListener("change", () => {
      setControlState(select, "clear");
      const panel = select.closest(".question");
      setStatus(panel, "clear");
      document.getElementById("summary").textContent = "";
      document.getElementById("summary").className = "summary";
      checkChoice(select, false);
      refreshChoicePanelStatus(panel);
    });
  });

  document.getElementById("resetAll").addEventListener("click", () => {
    document.querySelectorAll("input").forEach(input => { input.value = ""; });
    document.querySelectorAll("select").forEach(select => { select.selectedIndex = 0; });
    document.querySelectorAll(".question").forEach(clearPanel);
    const first = document.querySelector("input, select");
    if (first) first.focus();
  });

  document.getElementById("submitAll").addEventListener("click", () => {
    let allCorrect = true;

    document.querySelectorAll(".combined").forEach(panel => {
      if (checkCombined(panel, true) !== true) allCorrect = false;
    });

    document.querySelectorAll(".question select").forEach(select => {
      if (checkChoice(select, true) !== true) allCorrect = false;
    });

    document.querySelectorAll(".question").forEach(panel => {
      if (panel.querySelector("select")) refreshChoicePanelStatus(panel);
    });

    const summary = document.getElementById("summary");
    if (allCorrect) {
      summary.textContent = "You got it all correct! Good job!";
      summary.className = "summary success";
    } else {
      summary.textContent = "Keep going—you can try any red answers again.";
      summary.className = "summary try";
    }
  });
})();
</script>

</html>
