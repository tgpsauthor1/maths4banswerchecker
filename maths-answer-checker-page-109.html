<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Answer Checker – Page 109</title>
<style>
  :root{
    --blue:#0b72b9;
    --blue-dark:#075f99;
    --border:#cbd5e1;
    --text:#172033;
    --muted:#5b6473;
    --correct-bg:#e8f7ec;
    --correct-border:#2f8f46;
    --wrong-bg:#fdeaea;
    --wrong-border:#c84141;
    --focus:#f2b134;
    --panel:#f8fafc;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#eef4f8;
    color:var(--text);
    line-height:1.45;
  }
  .app{
    width:min(760px, calc(100% - 28px));
    margin:24px auto 40px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 28px rgba(15,23,42,.10);
    overflow:hidden;
  }
  header{
    background:var(--blue);
    color:white;
    padding:24px;
  }
  header h1{
    margin:0;
    font-size:clamp(1.45rem, 4vw, 2rem);
    line-height:1.2;
  }
  .toolbar{
    padding:18px 24px 0;
    display:flex;
    justify-content:flex-start;
  }
  button{
    appearance:none;
    border:0;
    border-radius:12px;
    font:inherit;
    font-weight:700;
    cursor:pointer;
    min-height:46px;
    padding:10px 18px;
  }
  button:focus-visible,
  input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:3px;
  }
  #resetBtn{
    background:#e7eef5;
    color:#19324a;
  }
  #resetBtn:hover{background:#dce7f0}
  main{padding:20px 24px 26px}
  .page-heading{
    margin:0 0 18px;
    font-size:1.15rem;
    font-weight:800;
    color:var(--blue-dark);
  }
  .question{
    background:var(--panel);
    border:2px solid transparent;
    border-radius:15px;
    padding:16px;
    margin:0 0 14px;
  }
  .question.correct{
    background:var(--correct-bg);
    border-color:var(--correct-border);
  }
  .question.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong-border);
  }
  .question-row{
    display:grid;
    grid-template-columns:minmax(90px, 140px) 1fr;
    gap:14px;
    align-items:center;
  }
  label{
    font-weight:800;
  }
  input[type="text"]{
    width:100%;
    min-height:48px;
    border:2px solid var(--border);
    border-radius:11px;
    background:white;
    padding:10px 12px;
    color:var(--text);
    font:inherit;
    font-size:1.05rem;
  }
  .question.correct input{border-color:var(--correct-border)}
  .question.wrong input{border-color:var(--wrong-border)}
  .feedback{
    min-height:1.5em;
    margin:8px 0 0;
    font-weight:800;
  }
  .question.correct .feedback{color:#246e37}
  .question.wrong .feedback{color:#a72d2d}
  .actions{
    padding:4px 24px 26px;
  }
  #submitBtn{
    width:100%;
    background:var(--blue);
    color:white;
    font-size:1.05rem;
  }
  #submitBtn:hover{background:var(--blue-dark)}
  #summary{
    margin:14px 0 0;
    min-height:1.5em;
    text-align:center;
    font-weight:800;
  }
  @media (max-width:560px){
    .app{width:min(100% - 16px, 760px); margin:8px auto 24px; border-radius:14px}
    header{padding:20px}
    .toolbar{padding:16px 18px 0}
    main{padding:18px}
    .actions{padding:2px 18px 22px}
    .question-row{grid-template-columns:1fr; gap:8px}
  }
  @media (prefers-reduced-motion:no-preference){
    .question,input,button{transition:background-color .15s ease,border-color .15s ease}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Checking answers for page 109</h1>
  </header>

  <div class="toolbar">
    <button type="button" id="resetBtn">Reset all</button>
  </div>

  <main aria-label="Answer checker">
    <p class="page-heading">Page 109</p>

    <section class="question" data-id="q1">
      <div class="question-row">
        <label for="q1">Question 1</label>
        <input id="q1" type="text" autocomplete="off" spellcheck="false" aria-describedby="q1-feedback">
      </div>
      <p class="feedback" id="q1-feedback" aria-live="polite"></p>
    </section>

    <section class="question" data-id="q2">
      <div class="question-row">
        <label for="q2">Question 2</label>
        <input id="q2" type="text" autocomplete="off" spellcheck="false" aria-describedby="q2-feedback">
      </div>
      <p class="feedback" id="q2-feedback" aria-live="polite"></p>
    </section>

    <section class="question" data-id="q3">
      <div class="question-row">
        <label for="q3">Question 3</label>
        <input id="q3" type="text" autocomplete="off" spellcheck="false" aria-describedby="q3-feedback">
      </div>
      <p class="feedback" id="q3-feedback" aria-live="polite"></p>
    </section>

    <section class="question" data-id="q4">
      <div class="question-row">
        <label for="q4">Question 4</label>
        <input id="q4" type="text" autocomplete="off" spellcheck="false" aria-describedby="q4-feedback">
      </div>
      <p class="feedback" id="q4-feedback" aria-live="polite"></p>
    </section>

    <section class="question" data-id="q5">
      <div class="question-row">
        <label for="q5">Question 5</label>
        <input id="q5" type="text" autocomplete="off" spellcheck="false" aria-describedby="q5-feedback">
      </div>
      <p class="feedback" id="q5-feedback" aria-live="polite"></p>
    </section>
  </main>

  <div class="actions">
    <button type="button" id="submitBtn">Submit all</button>
    <p id="summary" aria-live="polite"></p>
  </div>
</div>

<script>
(() => {
  "use strict";

  const items = Object.freeze({
    q1: { type: "text", accepted: ["cone"] },
    q2: { type: "text", accepted: ["cuboid"] },
    q3: { type: "text", accepted: ["sphere"] },
    q4: { type: "text", accepted: ["cube"] },
    q5: { type: "text", accepted: ["cylinder"] }
  });

  const normalizeText = (value) =>
    value.trim().replace(/\s+/g, " ").toLowerCase();

  const validateText = (value, rule) => {
    const normalized = normalizeText(value);
    return rule.accepted.some(answer => normalizeText(answer) === normalized);
  };

  const getPanel = (id) => document.querySelector(`.question[data-id="${id}"]`);
  const getInput = (id) => document.getElementById(id);
  const getFeedback = (id) => document.getElementById(`${id}-feedback`);

  function clearState(id) {
    const panel = getPanel(id);
    panel.classList.remove("correct", "wrong");
    getFeedback(id).textContent = "";
    getInput(id).removeAttribute("aria-invalid");
  }

  function setState(id, isCorrect) {
    const panel = getPanel(id);
    panel.classList.toggle("correct", isCorrect);
    panel.classList.toggle("wrong", !isCorrect);
    getFeedback(id).textContent = isCorrect ? "Correct!" : "Not quite. Try again.";
    getInput(id).setAttribute("aria-invalid", isCorrect ? "false" : "true");
  }

  function checkOne(id, markBlank = false) {
    const input = getInput(id);
    const value = input.value;
    if (normalizeText(value) === "") {
      if (markBlank) {
        setState(id, false);
        return false;
      }
      clearState(id);
      return null;
    }
    const isCorrect = validateText(value, items[id]);
    setState(id, isCorrect);
    return isCorrect;
  }

  Object.keys(items).forEach(id => {
    const input = getInput(id);

    input.addEventListener("input", () => {
      clearState(id);
      document.getElementById("summary").textContent = "";
    });

    input.addEventListener("blur", () => {
      checkOne(id, false);
    });
  });

  document.getElementById("submitBtn").addEventListener("click", () => {
    let allCorrect = true;

    Object.keys(items).forEach(id => {
      if (checkOne(id, true) !== true) allCorrect = false;
    });

    document.getElementById("summary").textContent = allCorrect
      ? "You got it all correct! Good job!"
      : "Keep going — have another try.";
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    Object.keys(items).forEach(id => {
      getInput(id).value = "";
      clearState(id);
    });
    document.getElementById("summary").textContent = "";
    getInput("q1").focus();
  });
})();
</script>
</body>
</html>
