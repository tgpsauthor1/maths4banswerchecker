<style>
  :root {
    color-scheme: light;
    --border: #c9d4df;
    --text: #17212b;
    --muted: #5e6b78;
    --surface: #ffffff;
    --panel: #f7f9fb;
    --focus: #1d6fdc;
    --good-bg: #e9f7ec;
    --good-border: #2f7d32;
    --bad-bg: #fdecec;
    --bad-border: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f1f4f7;
    color: var(--text);
  }
  .app {
    width: min(980px, calc(100% - 24px));
    margin: 0 auto;
    padding: 18px 0 42px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    background: #f1f4f7;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.3rem, 2.5vw, 2rem);
    line-height: 1.2;
  }
  button {
    min-height: 44px;
    border: 1px solid #8b98a5;
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    padding: 10px 16px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #f6f8fa; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
    outline-offset: 2px;
  }
  .page-section {
    margin-top: 20px;
    padding: 22px;
    border: 1px solid #d7e0e8;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgb(0 0 0 / 5%);
  }
  .page-section > h2 {
    margin: 0 0 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e6ebf0;
    font-size: 1.35rem;
  }
  .question-group {
    margin: 18px 0 26px;
    padding: 16px;
    border-radius: 12px;
    background: var(--panel);
  }
  .question-group:last-child { margin-bottom: 0; }
  .question-group h3 {
    margin: 0 0 14px;
    font-size: 1.08rem;
  }
  .answers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
    gap: 14px;
  }
  .answer-item {
    min-width: 0;
  }
  .answer-item label {
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .answer-item input {
    width: 100%;
    min-height: 48px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    padding: 8px 10px;
    font: inherit;
    font-size: 1.08rem;
  }
  .answer-item input.correct {
    border-color: var(--good-border);
    background: var(--good-bg);
  }
  .answer-item input.incorrect {
    border-color: var(--bad-border);
    background: var(--bad-bg);
  }
  .status {
    display: block;
    min-height: 1.35em;
    margin-top: 5px;
    font-size: .92rem;
    font-weight: 700;
  }
  .status.good { color: var(--good-border); }
  .status.bad { color: var(--bad-border); }
  .bottom-actions {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }
  #submit-all {
    min-width: 150px;
    background: #1d6fdc;
    border-color: #1d6fdc;
    color: #fff;
  }
  #submit-all:hover { background: #175fbd; }
  #global-status {
    min-height: 1.5em;
    font-weight: 800;
  }
  @media (max-width: 560px) {
    .topbar { align-items: flex-start; flex-direction: column; }
    .page-section { padding: 16px; }
    .question-group { padding: 14px; }
    .answers-grid { grid-template-columns: 1fr; }
    .bottom-actions { align-items: stretch; }
    #submit-all { width: 100%; }
  }
</style>
</head>

function normalizeText(value) {
  return value.trim().toLowerCase().replace(/\s+/g, " ");
}

function hasValidDecimalSyntax(value) {
  const s = value.trim();
  return /^-?(?:0|[1-9]\d*)(?:\.\d+)?$/.test(s);
}

function canonicalDecimal(value) {
  let s = value.trim();
  let negative = false;
  if (s.startsWith("-")) {
    negative = true;
    s = s.slice(1);
  }
  let [whole, fraction = ""] = s.split(".");
  fraction = fraction.replace(/0+$/, "");
  let out = fraction ? whole + "." + fraction : whole;
  if (out === "0") negative = false;
  return negative ? "-" + out : out;
}

function matchesDecimal(value, expected) {
  if (!hasValidDecimalSyntax(value)) return false;
  return canonicalDecimal(value) === canonicalDecimal(expected);
}

function isCorrect(value, rule) {
  const raw = value.trim();

  if (rule.type === "digit") {
    return /^[0-9]$/.test(raw) && raw === rule.value;
  }

  if (rule.type === "decimal") {
    return matchesDecimal(raw, rule.value);
  }

  if (rule.type === "text") {
    const normalized = normalizeText(raw);
    return rule.values.some(v => normalized === normalizeText(v));
  }

  if (rule.type === "mixed") {
    if (hasValidDecimalSyntax(raw) &&
        rule.numbers.some(v => canonicalDecimal(raw) === canonicalDecimal(v))) {
      return true;
    }
    const normalized = normalizeText(raw);
    return rule.texts.some(v => normalized === normalizeText(v));
  }

  return false;
}

function setVisual(input, state) {
  const id = input.dataset.itemId;
  const status = document.getElementById("status-" + id);
  input.classList.remove("correct", "incorrect");
  status.classList.remove("good", "bad");
  status.textContent = "";

  if (state === "correct") {
    input.classList.add("correct");
    status.classList.add("good");
    status.textContent = "Correct!";
  } else if (state === "incorrect") {
    input.classList.add("incorrect");
    status.classList.add("bad");
    status.textContent = "Not quite. Try again.";
  }
}

function checkInput(input, finalSubmission) {
  const value = input.value.trim();

  if (value === "") {
    if (finalSubmission) {
      setVisual(input, "incorrect");
      return false;
    }
    setVisual(input, "neutral");
    return null;
  }

  const ok = isCorrect(value, ITEMS[input.dataset.itemId]);
  setVisual(input, ok ? "correct" : "incorrect");
  return ok;
}
